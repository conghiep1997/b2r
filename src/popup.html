<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>B2R</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <img class="brand-icon" src="../assets/icons/icon-48.png" alt="B2R" />
        <div class="popup-header-info">
          <h1>Backlog to Redmine</h1>
          <p data-i18n="popup_subtitle"></p>
        </div>
        <div class="header-right">
          <span id="version" class="version"></span>
          <button
            id="donateButton"
            type="button"
            class="header-donate-btn"
            title="Ủng hộ tác giả"
            data-i18n-title="popup_donate"
            aria-label="Donate"
          >
            <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14" aria-hidden="true">
              <path
                d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
              />
            </svg>
          </button>
        </div>
      </header>

      <section class="status-card" aria-labelledby="statusTitle">
        <div class="section-heading">
          <div>
            <h2 id="statusTitle" data-i18n="popup_status_title"></h2>
            <p id="overallStatus" data-i18n="popup_checking"></p>
          </div>
          <span id="statusBadge" class="status-badge">...</span>
        </div>
        <div class="status-grid">
          <div class="status-item">
            <span>
              <i class="status-icon flow-icon">
                <svg
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  width="11"
                  height="11"
                  aria-hidden="true"
                >
                  <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z" />
                </svg>
              </i>
              <span data-i18n="popup_forward_label"></span>
            </span>
            <strong id="forwardStatus">...</strong>
          </div>
          <div class="status-item">
            <span>
              <i class="status-icon reverse-icon">
                <svg
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  width="11"
                  height="11"
                  aria-hidden="true"
                >
                  <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
                </svg>
              </i>
              <span data-i18n="popup_reverse_label"></span>
            </span>
            <strong id="reverseStatus">...</strong>
          </div>
          <div class="status-item">
            <span>
              <i class="status-icon ai-icon">
                <svg
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  width="12"
                  height="12"
                  aria-hidden="true"
                >
                  <path
                    d="M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.71-6.53H17V4h-7V2H8v2H1v1.99h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"
                  />
                </svg>
              </i>
              <span data-i18n="popup_ai_label"></span>
            </span>
            <strong id="providerStatus">...</strong>
          </div>
        </div>
      </section>

      <section class="project-card" aria-labelledby="projectTitle">
        <div class="section-heading">
          <div>
            <h2 id="projectTitle" data-i18n="popup_project_title"></h2>
            <p id="projectSummary"></p>
          </div>
          <span class="project-icon">
            <svg viewBox="0 0 24 24" fill="currentColor" width="15" height="15" aria-hidden="true">
              <path
                d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-1 8H5v-2h14v2zm0-4H5V8h14v2z"
              />
            </svg>
          </span>
        </div>
        <div class="project-details">
          <span data-i18n="popup_default_project"></span>
          <strong id="defaultProjectValue"></strong>
        </div>
      </section>

      <div class="actions">
        <button id="openMonthlyLog" class="button button-featured-main">
          <span class="button-icon">
            <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16" aria-hidden="true">
              <path
                d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"
              />
            </svg>
          </span>
          <span data-i18n="popup_log_time_month"></span>
        </button>
      </div>

      <section
        class="quick-links"
        aria-label="Thao tác nhanh"
        data-i18n-aria-label="popup_quick_actions"
      >
        <button id="openSettings" class="link-button link-button-settings">
          <span class="link-icon">
            <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14" aria-hidden="true">
              <path
                d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"
              />
            </svg>
          </span>
          <span data-i18n="popup_open_settings"></span>
        </button>
        <button id="openRedmine" class="link-button">
          <span class="link-icon">
            <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14" aria-hidden="true">
              <path
                d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"
              />
            </svg>
          </span>
          <span data-i18n="popup_open_redmine"></span>
        </button>
        <button id="openBacklog" class="link-button">
          <span class="link-icon">
            <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14" aria-hidden="true">
              <path
                d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"
              />
            </svg>
          </span>
          <span data-i18n="popup_open_backlog"></span>
        </button>
      </section>

      <p class="footer-note" data-i18n="popup_footer_note"></p>
    </main>

    <div id="donateModal" class="modal-backdrop" hidden>
      <section class="donate-modal" role="dialog" aria-modal="true" aria-labelledby="donateTitle">
        <button id="closeDonate" class="close-button" data-i18n-aria-label="popup_close">
          <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18" aria-hidden="true">
            <path
              d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
            />
          </svg>
        </button>
        <h2 id="donateTitle" data-i18n="popup_donate_title"></h2>
        <p class="donate-intro" data-i18n="popup_donate_intro"></p>
        <div id="donateTabs" class="donate-tabs" role="tablist"></div>
        <div id="donateContent" class="donate-content"></div>
      </section>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
