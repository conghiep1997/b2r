name: Deploy Extension

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: extension-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run Tests
        run: npm test

      - name: Build Project
        run: npm run build
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_SCOPES: https://www.googleapis.com/auth/spreadsheets
          REQUIRE_GOOGLE_OAUTH_CLIENT_ID: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch' }}
        
      - name: Get Version
        id: get_version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
        
      - name: Build ZIP
        run: npm run build:zip
        
      - name: Extract Latest Changes
        run: |
          awk '/^## \[/{count++} count==2{exit} count==1{print}' CHANGELOG.md > LATEST_CHANGES.md

      - name: Sync release tag to build commit
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force

      - name: Create Release
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch' }}
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Release ${{ steps.get_version.outputs.tag }}
          files: Backlog2Redmine-v*.zip
          body_path: LATEST_CHANGES.md
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Register version in backend
        if: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch') && steps.create_release.outputs.url }}
        run: node scripts/register-version.js
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          VERSION: ${{ steps.get_version.outputs.version }}
          DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.tag }}/Backlog2Redmine-v${{ steps.get_version.outputs.version }}.zip






